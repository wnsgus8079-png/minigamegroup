<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스네이크</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #2a2a3c;
    --cell: #3a3a52;
    --cell-hover: #47476a;
    --cell-revealed: #12121c;
    --border: #4a4a6a;
    --accent: #7aa2f7;
    --text: #e0e0f0;
    --danger: #f7768e;
    --success: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .home-link {
    align-self: flex-start;
    margin: 0 0 12px;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
  }
  .home-link:hover { text-decoration: underline; }
  h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: 1px; }
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    background: var(--cell-revealed);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .stat { font-size: 16px; font-weight: 600; color: var(--accent); }
  #restart {
    background: var(--cell);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  #restart:hover { background: var(--cell-hover); }
  canvas {
    display: block;
    background: var(--cell-revealed);
    border: 3px solid var(--border);
    border-radius: 6px;
  }
  #message {
    text-align: center;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
  }
  #message.lose { color: var(--danger); }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #8a8aa0;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <a class="home-link" href="../index.html">← 홈으로</a>
  <h1>🐍 스네이크</h1>
  <div class="panel">
    <div class="toolbar">
      <div class="stat">점수: <span id="score">0</span></div>
      <button id="restart">다시 시작</button>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <div id="message"></div>
    <div class="hint">방향키로 이동 · 벽/몸통에 부딪히면 게임 오버</div>
  </div>

<script>
(function () {
  const GRID = 20;
  const CELL = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');

  let snake, dir, nextDir, food, score, gameOver, loopId;
  const BASE_SPEED = 140;

  function init() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    scoreEl.textContent = '0';
    messageEl.textContent = '';
    messageEl.className = '';
    placeFood();
    draw();
    if (loopId) clearTimeout(loopId);
    scheduleTick();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function scheduleTick() {
    const speed = Math.max(70, BASE_SPEED - Math.floor(score / 5) * 5);
    loopId = setTimeout(() => {
      tick();
      if (!gameOver) scheduleTick();
    }, speed);
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = String(score);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#12121c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#f7768e';
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#9ece6a' : '#7aa2f7';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function endGame() {
    gameOver = true;
    clearTimeout(loopId);
    messageEl.textContent = `게임 오버! 최종 점수: ${score}`;
    messageEl.className = 'lose';
  }

  const KEY_DIR = {
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
  };

  document.addEventListener('keydown', (e) => {
    const d = KEY_DIR[e.key];
    if (!d) return;
    e.preventDefault();
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  restartBtn.addEventListener('click', init);

  init();
})();
</script>
</body>
</html>
