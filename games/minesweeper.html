<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지뢰찾기</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #2a2a3c;
    --cell: #3a3a52;
    --cell-hover: #47476a;
    --cell-revealed: #12121c;
    --border: #4a4a6a;
    --accent: #7aa2f7;
    --text: #e0e0f0;
    --danger: #f7768e;
    --success: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: 1px; }
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    max-width: 100%;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    background: var(--cell-revealed);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .stat {
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 600;
    min-width: 60px;
  }
  .stat.mines { color: var(--danger); }
  .stat.timer { color: var(--accent); }
  #face {
    font-size: 24px;
    background: var(--cell);
    border: none;
    border-radius: 8px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  #face:hover { background: var(--cell-hover); }
  #face:active { transform: scale(0.92); }
  .difficulty {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    justify-content: center;
  }
  .difficulty button {
    background: var(--cell);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .difficulty button.active {
    background: var(--accent);
    color: #1e1e2e;
    font-weight: 700;
    border-color: var(--accent);
  }
  .difficulty button:hover:not(.active) { background: var(--cell-hover); }
  #board {
    display: grid;
    gap: 2px;
    background: var(--border);
    border: 3px solid var(--border);
    border-radius: 6px;
    touch-action: manipulation;
  }
  .cell {
    width: 28px;
    height: 28px;
    background: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    border-radius: 3px;
  }
  .cell:hover { background: var(--cell-hover); }
  .cell.revealed {
    background: var(--cell-revealed);
    cursor: default;
  }
  .cell.revealed:hover { background: var(--cell-revealed); }
  .cell.mine { background: var(--danger); }
  .cell.mine.exploded { background: #ff4757; }
  .cell.flag { font-size: 14px; }
  .cell.n1 { color: #7aa2f7; }
  .cell.n2 { color: #9ece6a; }
  .cell.n3 { color: #f7768e; }
  .cell.n4 { color: #bb9af7; }
  .cell.n5 { color: #e0af68; }
  .cell.n6 { color: #7dcfff; }
  .cell.n7 { color: #c0caf5; }
  .cell.n8 { color: #a9b1d6; }
  #message {
    text-align: center;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
  }
  #message.win { color: var(--success); }
  #message.lose { color: var(--danger); }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #8a8aa0;
    margin-top: 8px;
  }
  .home-link {
    align-self: flex-start;
    margin: 0 0 12px;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
  }
  .home-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <a class="home-link" href="../index.html">← 홈으로</a>
  <h1>💣 지뢰찾기</h1>
  <div class="panel">
    <div class="difficulty" id="difficulty">
      <button data-level="beginner" class="active">초급 9x9</button>
      <button data-level="intermediate">중급 16x16</button>
      <button data-level="expert">고급 30x16</button>
    </div>
    <div class="toolbar">
      <div class="stat mines" id="mineCount">010</div>
      <button id="face">🙂</button>
      <div class="stat timer" id="timer">000</div>
    </div>
    <div id="board"></div>
    <div id="message"></div>
    <div class="hint">좌클릭: 열기 · 우클릭: 깃발 표시</div>
  </div>

<script>
(function () {
  const LEVELS = {
    beginner: { rows: 9, cols: 9, mines: 10 },
    intermediate: { rows: 16, cols: 16, mines: 40 },
    expert: { rows: 16, cols: 30, mines: 99 },
  };

  const boardEl = document.getElementById('board');
  const mineCountEl = document.getElementById('mineCount');
  const timerEl = document.getElementById('timer');
  const faceEl = document.getElementById('face');
  const messageEl = document.getElementById('message');
  const difficultyEl = document.getElementById('difficulty');

  let rows, cols, mineTotal;
  let grid = [];
  let firstClick = true;
  let gameOver = false;
  let revealedCount = 0;
  let flagCount = 0;
  let timerInterval = null;
  let seconds = 0;

  function init(level) {
    const cfg = LEVELS[level];
    rows = cfg.rows; cols = cfg.cols; mineTotal = cfg.mines;
    firstClick = true;
    gameOver = false;
    revealedCount = 0;
    flagCount = 0;
    seconds = 0;
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.textContent = '000';
    updateMineCount();
    faceEl.textContent = '🙂';
    messageEl.textContent = '';
    messageEl.className = '';

    grid = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        row.push({ mine: false, revealed: false, flagged: false, adj: 0 });
      }
      grid.push(row);
    }

    boardEl.style.gridTemplateColumns = `repeat(${cols}, 28px)`;
    boardEl.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.addEventListener('click', () => onLeftClick(r, c));
        cell.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          onRightClick(r, c);
        });
        boardEl.appendChild(cell);
      }
    }
  }

  function placeMines(excludeR, excludeC) {
    const forbidden = new Set();
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = excludeR + dr, nc = excludeC + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) forbidden.add(nr + ',' + nc);
      }
    }
    let placed = 0;
    while (placed < mineTotal) {
      const r = Math.floor(Math.random() * rows);
      const c = Math.floor(Math.random() * cols);
      if (grid[r][c].mine || forbidden.has(r + ',' + c)) continue;
      grid[r][c].mine = true;
      placed++;
    }
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].mine) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].mine) count++;
          }
        }
        grid[r][c].adj = count;
      }
    }
  }

  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      seconds++;
      if (seconds > 999) seconds = 999;
      timerEl.textContent = String(seconds).padStart(3, '0');
    }, 1000);
  }

  function updateMineCount() {
    const remaining = Math.max(0, mineTotal - flagCount);
    mineCountEl.textContent = String(remaining).padStart(3, '0');
  }

  function cellEl(r, c) {
    return boardEl.children[r * cols + c];
  }

  function onLeftClick(r, c) {
    if (gameOver) return;
    const cell = grid[r][c];
    if (cell.flagged || cell.revealed) return;

    if (firstClick) {
      placeMines(r, c);
      firstClick = false;
      startTimer();
    }

    if (cell.mine) {
      revealAllMines(r, c);
      endGame(false);
      return;
    }

    floodReveal(r, c);
    checkWin();
  }

  function onRightClick(r, c) {
    if (gameOver) return;
    const cell = grid[r][c];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    flagCount += cell.flagged ? 1 : -1;
    updateMineCount();
    const el = cellEl(r, c);
    if (cell.flagged) {
      el.textContent = '🚩';
      el.classList.add('flag');
    } else {
      el.textContent = '';
      el.classList.remove('flag');
    }
  }

  function floodReveal(startR, startC) {
    const stack = [[startR, startC]];
    while (stack.length) {
      const [r, c] = stack.pop();
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) continue;
      cell.revealed = true;
      revealedCount++;
      const el = cellEl(r, c);
      el.classList.add('revealed');
      if (cell.adj > 0) {
        el.textContent = cell.adj;
        el.classList.add('n' + cell.adj);
      } else {
        el.textContent = '';
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !grid[nr][nc].revealed && !grid[nr][nc].mine) {
              stack.push([nr, nc]);
            }
          }
        }
      }
    }
  }

  function revealAllMines(explodedR, explodedC) {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (cell.mine) {
          const el = cellEl(r, c);
          el.classList.add('revealed', 'mine');
          if (r === explodedR && c === explodedC) el.classList.add('exploded');
          el.textContent = '💣';
        } else if (cell.flagged) {
          const el = cellEl(r, c);
          el.textContent = '❌';
        }
      }
    }
  }

  function checkWin() {
    const safeTotal = rows * cols - mineTotal;
    if (revealedCount === safeTotal) {
      endGame(true);
    }
  }

  function endGame(won) {
    gameOver = true;
    clearInterval(timerInterval);
    faceEl.textContent = won ? '😎' : '💥';
    messageEl.textContent = won ? '승리했습니다! 🎉' : '지뢰를 밟았습니다...';
    messageEl.className = won ? 'win' : 'lose';
    if (won) {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].mine && !grid[r][c].flagged) {
            const el = cellEl(r, c);
            el.textContent = '🚩';
            el.classList.add('flag');
          }
        }
      }
    }
  }

  faceEl.addEventListener('click', () => {
    const active = difficultyEl.querySelector('button.active').dataset.level;
    init(active);
  });

  difficultyEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    difficultyEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    init(btn.dataset.level);
  });

  init('beginner');
})();
</script>
</body>
</html>
