<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 게임 모음</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #2a2a3c;
    --cell: #3a3a52;
    --cell-hover: #47476a;
    --cell-revealed: #12121c;
    --border: #4a4a6a;
    --accent: #7aa2f7;
    --text: #e0e0f0;
    --danger: #f7768e;
    --success: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 32px;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #8a8aa0;
    font-size: 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 20px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
  }
  .card:hover {
    background: var(--cell-hover);
    border-color: var(--accent);
    transform: translateY(-4px);
  }
  .card .icon {
    font-size: 40px;
  }
  .card .title {
    font-size: 18px;
    font-weight: 700;
  }
  .card .desc {
    font-size: 13px;
    color: #a8a8c0;
    line-height: 1.4;
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #6a6a80;
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <h1>🎮 미니 게임 모음</h1>
    <div class="subtitle">원하는 게임을 선택해서 바로 즐겨보세요</div>
  </header>

  <div class="grid">
    <a class="card" href="games/minesweeper.html">
      <div class="icon">💣</div>
      <div class="title">지뢰찾기</div>
      <div class="desc">숫자를 힌트 삼아 지뢰를 피해 모든 칸을 여는 클래식 퍼즐</div>
    </a>
    <a class="card" href="games/tictactoe.html">
      <div class="icon">⭕</div>
      <div class="title">틱택토</div>
      <div class="desc">두 명이 번갈아 두는 3x3 오목형 대전 게임</div>
    </a>
    <a class="card" href="games/2048.html">
      <div class="icon">🔢</div>
      <div class="title">2048</div>
      <div class="desc">같은 숫자 타일을 합쳐 2048을 만드는 퍼즐</div>
    </a>
    <a class="card" href="games/snake.html">
      <div class="icon">🐍</div>
      <div class="title">스네이크</div>
      <div class="desc">먹이를 먹으며 몸이 길어지는 뱀을 조종하는 아케이드 게임</div>
    </a>
    <a class="card" href="games/memory.html">
      <div class="icon">🃏</div>
      <div class="title">카드 짝맞추기</div>
      <div class="desc">카드를 뒤집어 같은 짝을 찾는 기억력 게임</div>
    </a>
  </div>

  <footer>← 각 게임 페이지 상단의 "홈으로" 링크로 언제든 돌아올 수 있습니다</footer>
</body>
</html>
